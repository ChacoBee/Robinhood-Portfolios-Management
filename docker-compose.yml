name: aurum-portfolio

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - aurum-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: api
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
    ports:
      - "8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build: .
    command: worker
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  aurum-postgres:
